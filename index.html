<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="description" content="Real-time weather forecast application with beautiful UI" />
  <meta name="theme-color" content="#667eea" />
  <title>Weather Forecast - Real Time Updates</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
</head>
<body>
  <div class="background-overlay"></div>
  
  <div class="container">
    <div class="app-card">
      <div class="header">
        <div class="logo">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C11.5 2 11 2.19 10.59 2.59L2.59 10.59C1.8 11.37 1.8 12.63 2.59 13.41L10.59 21.41C11.37 22.2 12.63 22.2 13.41 21.41L21.41 13.41C22.2 12.63 22.2 11.37 21.41 10.59L13.41 2.59C13 2.19 12.5 2 12 2Z" fill="url(#gradient1)"/>
            <circle cx="12" cy="12" r="4" fill="white" opacity="0.9"/>
            <defs>
              <linearGradient id="gradient1" x1="2" y1="2" x2="22" y2="22">
                <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
              </linearGradient>
            </defs>
          </svg>
          <h1>WeatherNow</h1>
        </div>
        <div class="current-time" id="currentTime"></div>
      </div>

      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input 
            type="text" 
            id="cityInput" 
            placeholder="Search for a city..." 
            onkeypress="handleKeyPress(event)"
          />
          <button class="search-btn" onclick="getWeather()">
            <span>Search</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="weatherBox" class="weather-content hidden">
        <div class="location-info">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <h2 id="location"></h2>
        </div>

        <div class="main-weather">
          <div class="weather-icon-container">
            <i id="icon" class="weather-icon"></i>
            <div class="weather-glow"></div>
          </div>
          
          <div class="temperature-display">
            <h3 id="temp"></h3>
            <div class="feels-like">
              <span>Feels like</span>
              <span id="feelsLike"></span>
            </div>
          </div>
        </div>

        <p id="condition" class="condition-text"></p>

        <div class="weather-details">
          <div class="detail-card">
            <div class="detail-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
              </svg>
            </div>
            <div class="detail-info">
              <span class="detail-label">Humidity</span>
              <p id="humidity" class="detail-value"></p>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
              </svg>
            </div>
            <div class="detail-info">
              <span class="detail-label">Wind Speed</span>
              <p id="wind" class="detail-value"></p>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M14.5 2v6M9.5 2v6M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path>
              </svg>
            </div>
            <div class="detail-info">
              <span class="detail-label">Pressure</span>
              <p id="pressure" class="detail-value"></p>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 6v6l4 2"></path>
              </svg>
            </div>
            <div class="detail-info">
              <span class="detail-label">Visibility</span>
              <p id="visibility" class="detail-value"></p>
            </div>
          </div>
        </div>

        <div class="last-updated">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span id="lastUpdate">Last updated: Now</span>
        </div>
      </div>

      <p id="error" class="error-message hidden"></p>
    </div>

    <footer class="footer">
      <p>Designed & Developed by <span class="developer-name">Ahmed Shah</span></p>
      <div class="footer-links">
        <a href="www.linkedin.com/in/ahmed-shah-web-developer-designer" class="footer-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
